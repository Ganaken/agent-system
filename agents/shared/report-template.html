<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Mulak Agent Report</title>
<style>
  :root{
    --bg:#060A17; --surface:#0B1120; --elevated:#111A2E;
    --blue:#3B82F6; --blue-bright:#60A5FA; --blue-deep:#1D4ED8;
    --green:#34D399; --red:#F87171; --amber:#FBBF24;
    --t1:#F1F5F9; --t2:#94A3B8; --t3:#64748B;
    --border:rgba(30,41,59,.6);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding:24px}
  .wrap{max-width:860px;margin:0 auto}
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
  .brand{font-size:22px;font-weight:800;letter-spacing:-.02em}
  .brand span{color:var(--blue-bright)}
  .badge{background:var(--elevated);border:1px solid var(--border);border-radius:999px;padding:6px 16px;font-size:13px;color:var(--t2)}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
  .date{color:var(--t3);font-size:14px;margin-bottom:28px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:32px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;text-align:center}
  .kpi .num{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .kpi .lbl{font-size:12px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px;font-weight:600}
  .good{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--amber)} .info{color:var(--blue-bright)}
  .gauge{position:relative;width:180px;height:180px;margin:0 auto 32px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .score{font-size:40px;font-weight:800}
  .gauge .of{font-size:12px;color:var(--t3)}
  h2{font-size:20px;font-weight:700;margin:32px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .item{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--blue);border-radius:14px;padding:16px 18px;margin-bottom:12px;font-size:15px}
  .item.critical{border-left-color:var(--red)}
  .item.high{border-left-color:var(--amber)}
  .item.ok{border-left-color:var(--green)}
  .item b{color:var(--blue-bright)}
  .item .tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:2px 10px;margin-bottom:6px}
  .tag.critical{background:rgba(248,113,113,.12);color:var(--red)}
  .tag.high{background:rgba(251,191,36,.12);color:var(--amber)}
  .tag.ok{background:rgba(52,211,153,.12);color:var(--green)}
  .content p{color:var(--t2);margin-bottom:12px;font-size:15px}
  .content strong{color:var(--t1)}
  .footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);color:var(--t3);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="brand">M<span>ulak</span> · Agent Report</div>
    <div class="badge">{{AGENT_NAME}}</div>
  </div>
  <h1>{{TITLE}}</h1>
  <div class="date">{{DATE}}</div>
  {{BODY}}
  <div class="footer">Generated automatically by the {{AGENT_NAME}} agent · Ganaken · Mulak</div>
</div>
</body>
</html>
